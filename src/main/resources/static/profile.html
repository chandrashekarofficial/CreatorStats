<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — CreatorStats</title>
    <style>
        *{box-sizing:border-box}
        body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f9fc;color:#0f172a}
        .page{max-width:900px;margin:0 auto;padding:32px 20px 80px}
        .top{display:flex;align-items:center;gap:14px;margin-bottom:30px}
        .logo{width:46px;height:46px;object-fit:contain}
        .back{color:#2563eb;text-decoration:none;font-weight:600;font-size:14px}
        .hero h1{margin:0 0 8px;font-size:34px;letter-spacing:-.8px}
        .hero p{margin:0 0 26px;color:#64748b}
        .card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:30px;box-shadow:0 12px 34px rgba(15,23,42,.06)}
        .channel{display:flex;align-items:center;gap:20px}
        .avatar{width:92px;height:92px;border-radius:50%;object-fit:cover;background:#eaf2ff;flex:none}
        .channel-info{min-width:0;flex:1}
        .channel-info h2{margin:0 0 6px;font-size:25px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .handle{color:#64748b;margin-bottom:8px}
        .connected{font-size:13px;color:#16a34a;font-weight:700}
        .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
        button,a.button{border:0;border-radius:11px;padding:12px 17px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
        .primary{background:#2563eb;color:#fff;box-shadow:0 8px 18px rgba(37,99,235,.18)}
        .secondary{background:#eff6ff;color:#2563eb}
        .danger{background:#fff1f2;color:#dc2626}
        .empty{text-align:center;padding:24px 8px}
        .empty-icon{width:68px;height:68px;margin:0 auto 18px;border-radius:18px;background:#eff6ff;color:#2563eb;display:grid;place-items:center;font-size:30px}
        .empty h2{margin:0 0 8px;font-size:24px}.empty p{max-width:560px;margin:0 auto 22px;color:#64748b;line-height:1.55}
        .status{display:none;border-radius:10px;padding:11px 13px;margin-bottom:18px;font-size:14px}
        .status.success{display:block;background:#ecfdf5;color:#15803d;border:1px solid #bbf7d0}
        .status.error{display:block;background:#fff1f2;color:#be123c;border:1px solid #fecdd3}
        .loading{text-align:center;color:#64748b;padding:24px}
        @media(max-width:650px){.page{padding:24px 16px 60px}.hero h1{font-size:29px}.card{padding:22px}.channel{align-items:flex-start}.avatar{width:72px;height:72px}.channel-info h2{font-size:21px}}
    </style>
</head>
<body>
<main class="page">
    <div class="top">
        <img class="logo" src="/images/creatorstats-logo.png" alt="CreatorStats">
        <a class="back" href="/">← Back to CreatorStats</a>
    </div>

    <section class="hero">
        <h1>My Profile</h1>
        <p>Connect your YouTube channel and open its CreatorStats analytics anytime.</p>
    </section>

    <div id="status" class="status"></div>

    <section class="card" id="profileCard">
        <div class="loading">Loading your channel...</div>
    </section>
</main>

<script>
(function () {
    "use strict";

    const card = document.getElementById("profileCard");
    const status = document.getElementById("status");
    const token = localStorage.getItem("creatorstats_token") || localStorage.getItem("token");

    function showStatus(message, type) {
        status.className = "status " + type;
        status.textContent = message;
    }

    function escapeHtml(value) {
        return String(value == null ? "" : value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    async function api(url, options) {
        const opts = options || {};
        opts.headers = Object.assign({}, opts.headers || {}, {
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json"
        });
        return fetch(url, opts);
    }

    async function loadChannel() {
        if (!token) {
            card.innerHTML = '<div class="empty"><div class="empty-icon">◉</div><h2>Sign in to connect your channel</h2><p>Your connected YouTube channel is linked to your CreatorStats account.</p><a class="button primary" href="/login.html">Sign In</a></div>';
            return;
        }

        try {
            const response = await api("/api/youtube/connected");
            if (response.status === 401 || response.status === 403) {
                card.innerHTML = '<div class="empty"><div class="empty-icon">◉</div><h2>Your session has expired</h2><p>Sign in again to manage your connected YouTube channel.</p><a class="button primary" href="/login.html">Sign In</a></div>';
                return;
            }
            if (!response.ok) throw new Error("Unable to load your channel.");

            const data = await response.json();
            if (!data.connected) {
                renderEmpty();
                return;
            }

            renderChannel(data);
        } catch (error) {
            card.innerHTML = '<div class="empty"><h2>Could not load your profile</h2><p>Please refresh and try again.</p></div>';
        }
    }

    function renderEmpty() {
        card.innerHTML = '<div class="empty"><div class="empty-icon">▶</div><h2>Connect Your YouTube Channel</h2><p>Connect your channel once, then open your CreatorStats analytics directly from your profile.</p><button class="primary" id="connectButton">Connect Your Channel</button></div>';
        document.getElementById("connectButton").addEventListener("click", connectChannel);
    }

    function renderChannel(data) {
        const thumbnail = data.thumbnail || "/images/creatorstats-logo.png";
        card.innerHTML = '<div class="channel">' +
            '<img class="avatar" src="' + escapeHtml(thumbnail) + '" alt="' + escapeHtml(data.channelName) + '">' +
            '<div class="channel-info">' +
            '<h2>' + escapeHtml(data.channelName) + '</h2>' +
            '<div class="handle">' + escapeHtml(data.handle || "YouTube channel") + '</div>' +
            '<div class="connected">✓ Connected to CreatorStats</div>' +
            '</div>' +
            '</div>' +
            '<div class="actions">' +
            '<a class="button primary" href="/analytics.html?channel=' + encodeURIComponent(data.channelId) + '">View Channel Analytics</a>' +
            '<button class="secondary" id="reconnectButton">Reconnect Channel</button>' +
            '<button class="danger" id="disconnectButton">Disconnect</button>' +
            '</div>';

        document.getElementById("reconnectButton").addEventListener("click", connectChannel);
        document.getElementById("disconnectButton").addEventListener("click", disconnectChannel);

        const image = card.querySelector(".avatar");
        image.addEventListener("error", function () {
            image.src = "/images/creatorstats-logo.png";
        });
    }

    async function connectChannel() {
        try {
            showStatus("Opening Google authorization...", "success");
            const response = await api("/api/youtube/connect");
            if (!response.ok) {
                const data = await response.json().catch(() => ({}));
                throw new Error(data.message || "YouTube connection is not configured yet.");
            }
            const data = await response.json();
            window.location.href = data.authorizationUrl;
        } catch (error) {
            showStatus(error.message, "error");
        }
    }

    async function disconnectChannel() {
        if (!confirm("Disconnect your YouTube channel from CreatorStats?")) return;
        try {
            const response = await api("/api/youtube/connected", { method: "DELETE" });
            if (!response.ok) throw new Error("Could not disconnect the channel.");
            showStatus("YouTube channel disconnected.", "success");
            renderEmpty();
        } catch (error) {
            showStatus(error.message, "error");
        }
    }

    const params = new URLSearchParams(window.location.search);
    if (params.get("youtube") === "connected") showStatus("Your YouTube channel is connected.", "success");
    if (params.get("youtube") === "error") showStatus("YouTube connection could not be completed. Please try again.", "error");

    loadChannel();
})();
</script>
<script src="/js/footer.js"></script>
</body>
</html>
